<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Learning Path Generator</title>
    <link rel="stylesheet" href="style.css">

    <!-- Load Firebase scripts FIRST -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>

<body>
    <header>
        <h1>Sign In</h1>
        <p>Please sign up or sign in to continue.</p>
    </header>

    <main>
        <section class="auth-section">
            <div class="auth-form">
                <input type="email" id="auth-email" placeholder="Email" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button id="sign-up-btn" class="action-btn">Sign Up</button>
                <button id="sign-in-btn" class="secondary-btn">Sign In</button>
                <div id="auth-message" class="message-area" style="margin-top:10px; display:none;"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Learning Path Generator</p>
    </footer>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCxmnIFjxaOCfaVuXOlubO0q5-dLUXTtSs",
            authDomain: "aura-learn.firebaseapp.com",
            projectId: "aura-learn",
            storageBucket: "aura-learn.firebasestorage.app",
            messagingSenderId: "368429399651",
            appId: "1:368429399651:web:d7ec579433ff3d55754256",
            measurementId: "G-0TGJGXW6R6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // DOM elements
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const signUpBtn = document.getElementById('sign-up-btn');
        const signInBtn = document.getElementById('sign-in-btn');
        const authMessageArea = document.getElementById('auth-message');

        function displayMessage(msg, type = "info") {
            authMessageArea.textContent = msg;
            authMessageArea.className = `message-area ${type}`;
            authMessageArea.style.display = 'block';
        }

        // Sign up function
        signUpBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                displayMessage("Please enter both email and password.", "warning");
                return;
            }

            if (password.length < 6) {
                displayMessage("Password should be at least 6 characters.", "warning");
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    displayMessage("Account created! Redirecting…", "success");
                    setTimeout(() => window.location.href = "interest.html", 1000);
                })
                .catch((error) => {
                    console.error("Sign up error:", error);
                    displayMessage("Error: " + error.message, "error");
                });
        });

        // Sign in function
        signInBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                displayMessage("Please enter both email and password.", "warning");
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    displayMessage("Signed in! Redirecting…", "success");
                    setTimeout(() => window.location.href = "interest.html", 1000);
                })
                .catch((error) => {
                    console.error("Sign in error:", error);
                    displayMessage("Error: " + error.message, "error");
                });
        });

        // Redirect if already signed in
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log("User already signed in:", user.email);
                window.location.href = "interest.html";
            }
        });

        // Add Enter key support
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                signInBtn.click();
            }
        });
    </script>
</body>

</html>
