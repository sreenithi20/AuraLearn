<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Module – AuraLearn</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>

<body>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="interest.html">Generate Path</a>
        <a href="study.html">Study Module</a>
        <a href="favorites.html">Saved Paths</a>
        <a href="gamification.html">Gamification</a>
        <a href="achievements.html">Achievements</a>
        <a href="signin.html">Sign In</a>
    </nav>
    <div class="hero">
        <div class="hero-background" style="background-image: url('https://images.unsplash.com/photo-1542831371-29b0f74f9713?q=80&w=2940&auto=format&fit=crop');"></div>
        <div class="hero-content">
            <h1>Study Module</h1>
            <p>Generate notes from your syllabus.</p>
        </div>
    </div>
    <main>
        <section class="content-section">
            <h2>Generate Notes</h2>
            <div class="input-group">
                <label for="syllabus-input">Enter Your Syllabus:</label>
                <textarea id="syllabus-input" placeholder="e.g., Chapter 1: Introduction to AI, Chapter 2: Machine Learning Fundamentals..." rows="10"></textarea>
            </div>
            <div class="button-group">
                <button id="generate-notes-btn" class="action-btn">Generate Notes</button>
            </div>
            <div id="loading-spinner" class="loading-spinner" style="display: none;"></div>
            <div id="messages" class="message-area" style="margin-top: 10px; display:none;"></div>
        </section>
        <section id="notes-section" class="content-section" style="display:none;">
            <h2>Generated Notes</h2>
            <div id="notes-content"></div>
            <div class="button-group" style="margin-top: 20px;">
                <button id="download-notes-btn" class="secondary-btn">Download Notes</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 AuraLearn. All Rights Reserved.</p>
    </footer>
</body>

</html>
