<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Interests – AuraLearn</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>

<body>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="interest.html">Generate Path</a>
        <a href="study.html">Study Module</a>
        <a href="favorites.html">Saved Paths</a>
        <a href="gamification.html">Gamification</a>
        <a href="achievements.html">Achievements</a>
        <a href="signin.html">Sign In</a>
    </nav>
    <div class="hero">
        <div class="hero-background" style="background-image: url('https://images.unsplash.com/photo-1510531704581-5b28709aa698?q=80&w=2874&auto=format&fit=crop');"></div>
        <div class="hero-content">
            <h1>Choose Your Interests</h1>
            <p>Generate a personalized learning path based on your interests.</p>
        </div>
    </div>
    <main>
        <section class="content-section">
            <div class="input-group">
                <label for="primary-interest">Primary Interest:</label>
                <input type="text" id="primary-interest" placeholder="e.g., AI in Agriculture">
            </div>
            <div class="input-group">
                <label for="interdisciplinary-topics">Interdisciplinary Topics (optional):</label>
                <input type="text" id="interdisciplinary-topics" placeholder="e.g., space technology, data science">
            </div>
            <div class="button-group">
                <button id="generate-path-btn" class="action-btn">Generate Learning Path</button>
            </div>
            <div id="loading-spinner" class="loading-spinner" style="display: none;"></div>
            <div id="messages" class="message-area" style="margin-top: 10px; display:none;"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 AuraLearn. All Rights Reserved.</p>
    </footer>
</body>

</html>
